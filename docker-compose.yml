services:
  # 1. PHP App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    # SRE Tip: Load thẳng file .env mà Jenkins vừa tạo
    env_file:
      - .env
    environment:
      # App chỉ cần biết user thường, không cần biết root password
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-laravel_db}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - laravel-net
      - private-net
    depends_on:
      db:
        condition: service_healthy

  # 2. Nginx Web Server
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    networks:
      - laravel-net
    depends_on:
      - app

  # 3. Database MySQL
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_db}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SecretRootPass123!}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - private-net
    ports:
      - "3307:3306" 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-SecretRootPass123!}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s 

networks:
  laravel-net:
    driver: bridge
  private-net:
    driver: bridge

volumes:
  dbdata: